name: Release Linux

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: write

jobs:
  gate:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release_gate.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Read release version
        id: meta
        shell: bash
        run: |
          version="$(dotnet msbuild -nologo -getProperty:Version ./src/Pop.App.Linux/Pop.App.Linux.csproj | tail -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the release exists for this commit
        id: release_gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Release workflow also concludes 'success' when its version gate skips the
          # release jobs, so only proceed when the release for this exact commit exists.
          # Otherwise a non-version-bump run could clobber assets on the previous tag.
          release_tag="v${{ steps.meta.outputs.version }}"
          head_sha="${{ github.event.workflow_run.head_sha }}"

          if ! target="$(gh release view "$release_tag" --repo "${{ github.repository }}" --json targetCommitish --jq .targetCommitish)"; then
            echo "Release $release_tag does not exist; the triggering run did not publish a release. Skipping Linux packaging."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$target" != "$head_sha" ]]; then
            echo "Release $release_tag targets $target but this run built $head_sha. Skipping Linux packaging to avoid clobbering release assets."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

  release-linux:
    needs: gate
    if: ${{ needs.gate.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test shared .NET suite
        run: dotnet test tests/Pop.Tests/Pop.Tests.csproj --configuration Release

      - name: Make Linux package script executable
        run: chmod +x ./scripts/package-linux-release.sh

      - name: Package Linux app
        id: package
        shell: bash
        env:
          # Pinned sha256 of the appimagetool-x86_64.AppImage asset on AppImageKit tag 13
          # (currently published as obsolete-appimagetool-x86_64.AppImage).
          APPIMAGETOOL_SHA256: df3baf5ca5facbecfc2f3fa6713c29ab9cefa8fd8c1eac5d283b79cab33e4acb
        run: |
          package_output="$(./scripts/package-linux-release.sh)"
          echo "$package_output"

          tar_path="$(printf '%s\n' "$package_output" | grep '^tar_path=' | tail -n 1 | cut -d= -f2-)"
          if [[ -z "$tar_path" ]]; then
            echo "Unable to read Linux package output path." >&2
            exit 1
          fi

          appimage_path="$(printf '%s\n' "$package_output" | grep '^appimage_path=' | tail -n 1 | cut -d= -f2-)"
          if [[ -z "$appimage_path" ]]; then
            echo "Unable to read Linux AppImage output path." >&2
            exit 1
          fi

          echo "tar_path=$tar_path" >> "$GITHUB_OUTPUT"
          echo "appimage_path=$appimage_path" >> "$GITHUB_OUTPUT"

      - name: Upload Linux asset to GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="v${{ needs.gate.outputs.version }}"
          tar_asset="${{ steps.package.outputs.tar_path }}"
          appimage_asset="${{ steps.package.outputs.appimage_path }}"

          if [[ ! -f "$tar_asset" ]]; then
            echo "Unable to find the generated Linux tarball asset." >&2
            exit 1
          fi

          if [[ ! -f "$appimage_asset" ]]; then
            echo "Unable to find the generated Linux AppImage asset." >&2
            exit 1
          fi

          for asset in "$appimage_asset" "$tar_asset"; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256")
          done

          if gh release view "$release_tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              "$appimage_asset" "$appimage_asset.sha256" \
              "$tar_asset" "$tar_asset.sha256" \
              --repo "${{ github.repository }}" --clobber
          else
            echo "Release $release_tag does not exist after the main Release workflow completed." >&2
            exit 1
          fi

      - name: Upload Linux release artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: pop-release-linux
          path: artifacts/linux/release/*
